          - listitem [ref=f1e312]:
            - heading "Turn issues into PRs" [level=3] [ref=f1e313]
            - paragraph [ref=f1e314]: Stop bouncing between tools. Claude Code works with GitHub, GitLab, and your command line tools to read issues, write code, run tests, and open pull requests.
          - listitem [ref=f1e315]:
            - heading "Run multi-hour refactors and migrations" [level=3] [ref=f1e316]
